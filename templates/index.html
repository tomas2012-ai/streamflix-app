<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix Cinema Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --primary-glow: rgba(229, 9, 20, 0.4);
            --bg-dark: #090a0f;
            --card-bg: rgba(20, 22, 30, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #9a9ab0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(229, 9, 20, 0.09) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(80, 20, 120, 0.12) 0%, transparent 50%);
            background-attachment: fixed;
            padding-bottom: 80px;
        }

        header { 
            background: rgba(9, 10, 15, 0.85); 
            backdrop-filter: blur(20px);
            padding: 18px 50px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .logo { 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: 2px; 
            background: linear-gradient(135deg, #e50914 0%, #ff5252 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-actions { display: flex; gap: 15px; }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        .btn-primary:hover {
            background: #ff1e27;
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .container { max-width: 1480px; margin: 0 auto; padding: 0 40px; }

        .hero { text-align: center; margin: 45px 0 35px; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 12px; }
        .hero p { color: var(--text-muted); font-size: 1.2rem; }

        /* Panel Kontrolny */
        .control-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px);
            padding: 18px 28px; 
            border-radius: 20px; 
            margin-bottom: 45px; 
            display: flex; 
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between; 
            gap: 20px; 
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .search-box { flex-grow: 1; max-width: 480px; }
        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 14px 22px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus { 
            border-color: var(--primary); 
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        select { 
            background: rgba(255, 255, 255, 0.04); 
            color: #fff; 
            border: 1px solid var(--card-border); 
            padding: 14px 22px; 
            border-radius: 12px; 
            font-size: 14px;
            font-weight: 600;
            outline: none; 
            cursor: pointer;
            transition: all 0.3s;
        }

        /* Grid Filmów */
        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 50px 0 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::before {
            content: '';
            width: 5px;
            height: 28px;
            background: var(--primary);
            border-radius: 4px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 28px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            cursor: pointer; 
            border: 1px solid var(--card-border); 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        .card:hover { 
            transform: translateY(-10px) scale(1.02); 
            border-color: var(--primary); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px var(--primary-glow); 
        }

        .card-poster { 
            width: 100%; 
            height: 330px; 
            background-size: cover; 
            background-position: center; 
            position: relative;
        }

        .card-poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 55%, rgba(20, 22, 30, 1) 100%);
        }

        .fav-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-size: 18px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .fav-icon:hover { transform: scale(1.15); background: rgba(229, 9, 20, 0.8); }
        .fav-icon.active { color: #e50914; }

        .card-body { 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex-grow: 1; 
            position: relative;
            z-index: 2;
            margin-top: -25px;
        }

        .card-title { 
            font-size: 15px; 
            font-weight: 700; 
            color: #fff; 
            margin-bottom: 8px; 
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        
        .badge-rating { 
            background: rgba(70, 211, 105, 0.12); 
            color: #46d369; 
            border: 1px solid rgba(70, 211, 105, 0.25); 
            padding: 4px 10px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 700; 
        }

        .card-year { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .load-more-box { text-align: center; margin: 45px 0; }

        /* Rekomendacje Przewijane Poziomo */
        .horizontal-scroll {
            display: flex;
            gap: 22px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 10px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .horizontal-scroll .card { min-width: 200px; max-width: 200px; flex-shrink: 0; }

        /* Modal / Pop-up */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.9); 
            backdrop-filter: blur(15px); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content { 
            background: #11131a; 
            width: 100%; 
            max-width: 920px; 
            border-radius: 24px; 
            padding: 35px; 
            position: relative; 
            border: 1px solid var(--card-border); 
            max-height: 90vh; 
            overflow-y: auto; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            font-size: 32px; 
            color: var(--text-muted); 
            cursor: pointer; 
            z-index: 10;
        }
        .close-btn:hover { color: #fff; }

        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 16px; 
            margin-bottom: 25px; 
            background: #000; 
        }

        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .gallery-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            transition: transform 0.3s;
        }
        .gallery-img:hover { transform: scale(1.05); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="resetSearch()">STREAMFLIX</div>
        <div class="nav-actions">
            <button class="btn" onclick="showFavorites()">❤️ Ulubione (<span id="favCount">0</span>)</button>
            <button class="btn btn-primary" onclick="randomMovie()">🎲 Losowy Film</button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Nieskończony Świat Kina</h1>
            <p>Odkrywaj tysiące filmów, oglądaj zwiastuny i przeglądaj galerie kadrów w jakości HD</p>
        </div>

        <div class="control-panel">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Szukaj ulubionego filmu..." oninput="debounceLoad()">
            </div>
            
            <select id="genreSelect" onchange="resetAndLoad()">
                <option value="wszystkie">Wszystkie Gatunki</option>
                <option value="akcja">Akcja</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="dramat">Dramat</option>
                <option value="komedia">Komedia</option>
                <option value="horror">Horror</option>
                <option value="kryminal">Kryminał</option>
                <option value="thriller">Thriller</option>
                <option value="animacja">Animacja</option>
                <option value="fantasy">Fantasy</option>
                <option value="przygoda">Przygoda</option>
                <option value="dokument">Dokument</option>
                <option value="romans">Romans</option>
                <option value="wojenny">Wojenny</option>
            </select>
        </div>

        <!-- Główna Sekcja Filmów -->
        <h2 class="section-title" id="gridTitle">Odkrywaj Filmy</h2>
        <div class="grid" id="moviesGrid"></div>

        <div class="load-more-box" id="loadMoreBox">
            <button class="btn btn-primary" style="padding: 14px 40px; font-size: 16px;" onclick="loadMore()">Załaduj Więcej Filmów</button>
        </div>

        <!-- Sekcja Rekomendacji Tematycznych -->
        <div id="rekomendacjeWrapper">
            <h2 class="section-title">🧪 Dla Fanów "Breaking Bad" i Mocnych Wrażeń</h2>
            <div class="horizontal-scroll" id="recBB"></div>

            <h2 class="section-title">🚀 Klasyki Sci-Fi i Przegląd Kosmosu</h2>
            <div class="horizontal-scroll" id="recScifi"></div>

            <h2 class="section-title">🔥 Najlepsze Kino Akcji</h2>
            <div class="horizontal-scroll" id="recAction"></div>
        </div>
    </div>

    <!-- Modal ze szczegółami i zwiastunem -->
    <div id="filmModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModalDirect()">&times;</span>
            <div class="video-container" id="videoBox"></div>
            <h2 id="mTitle" style="font-size: 28px; font-weight: 800; margin-bottom: 12px;"></h2>
            <p id="mDesc" style="font-size: 15px; color: #ccc; line-height: 1.7; margin-bottom: 20px;"></p>
            
            <h4 style="margin-bottom: 10px; font-size: 16px; color: #fff;">📸 Kadry z filmu:</h4>
            <div class="gallery-grid" id="mGallery"></div>

            <div style="font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--card-border); padding-top: 18px; margin-top: 15px;">
                Obsada: <span id="mCastList" style="color: #fff; font-weight: 600;"></span>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let timer;
        let favorites = JSON.parse(localStorage.getItem('streamflix_favs')) || [];

        function updateFavCount() {
            document.getElementById('favCount').innerText = favorites.length;
        }

        function toggleFavorite(event, filmJson) {
            event.stopPropagation();
            const film = JSON.parse(decodeURIComponent(filmJson));
            const index = favorites.findIndex(f => f.id === film.id);
            
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(film);
            }
            
            localStorage.setItem('streamflix_favs', JSON.stringify(favorites));
            updateFavCount();
            
            // Odśwież wygląd serduszek
            document.querySelectorAll(`.fav-btn-${film.id}`).forEach(el => {
                el.classList.toggle('active');
                el.innerText = index > -1 ? '🤍' : '❤️';
            });
        }

        function isFav(id) {
            return favorites.some(f => f.id === id);
        }

        function createCardHTML(film) {
            const favClass = isFav(film.id) ? 'active' : '';
            const favHeart = isFav(film.id) ? '❤️' : '🤍';
            const filmStr = encodeURIComponent(JSON.stringify(film));

            return `
                <div class="card" onclick="openModal(${film.id})">
                    <div class="fav-icon fav-btn-${film.id} ${favClass}" onclick="toggleFavorite(event, '${filmStr}')">${favHeart}</div>
                    <div class="card-poster" style="background-image: url('${film.plakat}');"></div>
                    <div class="card-body">
                        <div class="card-title">${film.tytul}</div>
                        <div class="card-meta">
                            <span class="badge-rating">★ ${film.ocena}</span>
                            <span class="card-year">${film.rok}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function debounceLoad() {
            clearTimeout(timer);
            timer = setTimeout(resetAndLoad, 350);
        }

        function resetAndLoad() {
            currentPage = 1;
            document.getElementById('moviesGrid').innerHTML = '';
            document.getElementById('gridTitle').innerText = 'Odkrywaj Filmy';
            document.getElementById('rekomendacjeWrapper').style.display = 'block';
            loadMovies();
        }

        async function loadMovies() {
            const genre = document.getElementById('genreSelect').value;
            const search = document.getElementById('searchInput').value;
            
            const response = await fetch(`/api/filmy?gatunek=${genre}&szukaj=${encodeURIComponent(search)}&page=${currentPage}`);
            const data = await response.json();
            
            const grid = document.getElementById('moviesGrid');
            
            if (search.length > 0) {
                document.getElementById('rekomendacjeWrapper').style.display = 'none';
            }

            if (!data.results || data.results.length === 0) {
                if (currentPage === 1) grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 60px;">Brak wyników.</p>';
                document.getElementById('loadMoreBox').style.display = 'none';
                return;
            }

            data.results.forEach(film => {
                grid.innerHTML += createCardHTML(film);
            });

            document.getElementById('loadMoreBox').style.display = currentPage < data.total_pages ? 'block' : 'none';
        }

        function loadMore() {
            currentPage++;
            loadMovies();
        }

        async function loadRekomendacje() {
            const res = await fetch('/api/rekomendacje');
            const data = await res.json();

            const renderSection = (id, list) => {
                const box = document.getElementById(id);
                box.innerHTML = list.map(f => createCardHTML(f)).join('');
            };

            renderSection('recBB', data.breaking_bad || []);
            renderSection('recScifi', data.scifi_classics || []);
            renderSection('recAction', data.action_hits || []);
        }

        async function randomMovie() {
            const res = await fetch('/api/losowy');
            const data = await res.json();
            if (data.id) openModal(data.id);
        }

        function showFavorites() {
            document.getElementById('rekomendacjeWrapper').style.display = 'none';
            document.getElementById('gridTitle').innerText = '❤️ Twoje Ulubione Filmy';
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            document.getElementById('loadMoreBox').style.display = 'none';

            if (favorites.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 60px;">Nie dodałeś jeszcze żadnych filmów do ulubionych!</p>';
                return;
            }

            favorites.forEach(film => {
                grid.innerHTML += createCardHTML(film);
            });
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('genreSelect').value = 'wszystkie';
            resetAndLoad();
        }

        async function openModal(movieId) {
            const res = await fetch(`/api/film/${movieId}`);
            const film = await res.json();
            
            document.getElementById('mTitle').innerText = `${film.tytul} (${film.rok})`;
            document.getElementById('mDesc').innerText = film.opis;
            document.getElementById('mCastList').innerText = film.obsada;

            // Galeria
            const gBox = document.getElementById('mGallery');
            gBox.innerHTML = '';
            if (film.zdjecia && film.zdjecia.length > 0) {
                film.zdjecia.forEach(url => {
                    gBox.innerHTML += `<img src="${url}" class="gallery-img">`;
                });
            } else {
                gBox.innerHTML = '<p style="color:#666; font-size:13px;">Brak dodatkowych kadrów.</p>';
            }
            
            const videoBox = document.getElementById('videoBox');
            if(film.trailer_key) {
                videoBox.style.display = 'block';
                videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${film.trailer_key}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else {
                videoBox.style.display = 'none';
                videoBox.innerHTML = '';
            }
            
            document.getElementById('filmModal').style.display = 'flex';
        }

        function closeModalDirect() {
            document.getElementById('filmModal').style.display = 'none';
            document.getElementById('videoBox').innerHTML = '';
        }

        function closeModal(event) {
            if (event.target.id === 'filmModal') closeModalDirect();
        }

        // Inicjalizacja
        updateFavCount();
        loadMovies();
        loadRekomendacje();
    </script>
</body>
</html>
