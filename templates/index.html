<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix — Kino Premium TMDB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #E50914;
            --primary-glow: rgba(229, 9, 20, 0.5);
            --bg-dark: #09090b;
            --card-bg: #141419;
            --card-hover: #1f1f28;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* EKRAN POWITALNY PREMIUM */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, rgba(5,5,5,0.95), rgba(20,5,8,0.92)),
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 2000; padding: 20px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .welcome-badge { background: rgba(229,9,20,0.15); color: var(--primary); border: 1px solid rgba(229,9,20,0.4); padding: 8px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .welcome-title { font-size: 5rem; color: #fff; font-weight: 900; letter-spacing: 4px; margin-bottom: 15px; text-shadow: 0 0 40px rgba(229,9,20,0.5); }
        .welcome-title span { color: var(--primary); }
        .welcome-desc { font-size: 1.25rem; color: var(--text-muted); max-width: 650px; margin-bottom: 40px; line-height: 1.6; }
        
        .btn-portal {
            padding: 20px 50px; font-size: 1.2rem; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, #e50914, #b20710); border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px var(--primary-glow); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 15px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-portal:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 15px 40px rgba(229, 9, 20, 0.8); }

        /* NAGŁÓWEK GŁÓWNY */
        header {
            position: sticky; top: 0; z-index: 1000; background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px); padding: 18px 50px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo { color: var(--primary); font-size: 28px; font-weight: 900; text-decoration: none; letter-spacing: 1.5px; text-shadow: 0 0 20px var(--primary-glow); }
        
        .search-bar { display: flex; align-items: center; background: rgba(255,255,255,0.06); border-radius: 30px; padding: 8px 20px; width: 360px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .search-bar:focus-within { border-color: var(--primary); background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(229,9,20,0.2); }
        .search-bar input { background: transparent; border: none; outline: none; color: #fff; width: 100%; padding: 4px; font-size: 0.95rem; }
        .search-bar i { color: var(--text-muted); }

        /* KONTROLI I FILTRY */
        .controls-section { padding: 40px 50px 20px; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        .action-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .btn-action {
            padding: 12px 24px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; cursor: pointer; font-size: 0.95rem; font-weight: 600;
            display: flex; align-items: center; gap: 10px; transition: all 0.25s ease;
        }
        .btn-action:hover, .btn-action.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 5px 20px var(--primary-glow); transform: translateY(-2px); }

        /* SIATKA FILMÓW */
        .main-container { padding: 10px 50px 80px; max-width: 1600px; margin: 0 auto; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 30px; }
        
        .movie-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); cursor: pointer; position: relative;
            border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .movie-card:hover { transform: translateY(-10px) scale(1.02); background: var(--card-hover); border-color: rgba(229,9,20,0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(229,9,20,0.2); }
        
        .poster-container { position: relative; width: 100%; height: 340px; overflow: hidden; }
        .movie-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .movie-card:hover img { transform: scale(1.08); }
        
        .rating-badge {
            position: absolute; top: 12px; left: 12px; background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px); padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold;
            color: var(--gold); display: flex; align-items: center; gap: 5px; border: 1px solid rgba(245,158,11,0.3);
        }

        .fav-icon {
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; transition: 0.25s; z-index: 2; border: 1px solid rgba(255,255,255,0.1);
        }
        .fav-icon:hover { background: var(--primary); border-color: var(--primary); transform: scale(1.15); }
        .fav-icon.active { color: var(--primary); background: rgba(229,9,20,0.2); border-color: var(--primary); }

        .movie-info { padding: 18px; }
        .movie-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .movie-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

        /* OKNO MODALNE (SZCZEGÓŁY + PLAYER ZWIASTUNU) */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.88); backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center;
            z-index: 3000; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 20px;
        }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: #141419; width: 100%; max-width: 850px; border-radius: 20px;
            overflow: hidden; position: relative; padding: 35px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1);
        }
        .close-modal { position: absolute; top: 20px; right: 25px; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .close-modal:hover { color: #fff; }
        .modal-title { font-size: 2.2rem; color: #fff; font-weight: 800; letter-spacing: 0.5px; }
        .modal-desc { font-size: 1rem; line-height: 1.7; color: var(--text-muted); max-height: 120px; overflow-y: auto; }
        
        .trailer-box { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.1); }
        .trailer-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .loader { grid-column: 1/-1; text-align: center; padding: 100px; font-size: 1.2rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- EKRAN POWITALNY -->
    <div id="welcome-screen">
        <div class="welcome-badge"><i class="fa-solid fa-fire"></i> Zasilane przez TMDB API</div>
        <h1 class="welcome-title">STREAM<span>FLIX</span></h1>
        <p class="welcome-desc">Odkryj tysiące kinowych hitów, najnowsze blockbustery, oceny społeczności oraz oficjalne zwiastuny w najwyższej jakości.</p>
        <button class="btn-portal" onclick="enterApp()">
            <span>Rozpocznij seans</span>
            <i class="fa-solid fa-play"></i>
        </button>
    </div>

    <!-- NAGŁÓWEK -->
    <header>
        <a href="#" class="logo">STREAMFLIX</a>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Szukaj wśród wszystkich filmów..." oninput="filterMovies()">
        </div>
    </header>

    <!-- PANEL AKCJI -->
    <section class="controls-section">
        <div class="action-buttons">
            <button class="btn-action active" onclick="showAllMovies(this)">
                <i class="fa-solid fa-fire"></i> Wszystkie Filmy TMDB
            </button>
            <button class="btn-action" onclick="getRandomMovie()">
                <i class="fa-solid fa-dice"></i> Wylosuj Film
            </button>
            <button class="btn-action" onclick="showFavorites(this)">
                <i class="fa-solid fa-heart"></i> Ulubione (<span id="favCount">0</span>)
            </button>
        </div>
    </section>

    <!-- SIATKA FILMÓW -->
    <main class="main-container">
        <div class="movie-grid" id="movieGrid">
            <div class="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top: 15px;">Pobieranie bazy filmów z TMDB...</p></div>
        </div>
    </main>

    <!-- MODAL -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 class="modal-title" id="modalTitle">Tytuł</h2>
            <p class="modal-desc" id="modalDesc">Opis...</p>
            <div class="trailer-box">
                <iframe id="modalTrailer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];
        let favoriteIds = [];

        function enterApp() {
            document.getElementById('welcome-screen').classList.add('hidden');
            fetchMoviesFromTMDB();
        }

        async function fetchMoviesFromTMDB() {
            try {
                const response = await fetch('/api/movies');
                allMovies = await response.json();
                renderMovies(allMovies);
            } catch (err) {
                console.error("Błąd połączenia z API:", err);
                document.getElementById('movieGrid').innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--primary);">Błąd ładowania filmów z TMDB.</p>`;
            }
        }

        function renderMovies(movies) {
            const container = document.getElementById('movieGrid');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 60px; font-size: 1.1rem;">Brak filmów spełniających kryteria wyszukiwania.</p>`;
                return;
            }

            movies.forEach(movie => {
                const isFav = favoriteIds.includes(movie.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-container" onclick="openMovieDetails(${movie.id})">
                        <div class="rating-badge"><i class="fa-solid fa-star"></i> ${movie.rating}</div>
                        <div class="fav-icon ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${movie.id})" title="Ulubione">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                        <img src="${movie.poster}" alt="${movie.title}" loading="lazy">
                    </div>
                    <div class="movie-info" onclick="openMovieDetails(${movie.id})">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>TMDB Hit</span>
                            <span style="color: var(--primary); font-weight: 600;">Odtwórz</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favoriteIds.includes(id)) {
                favoriteIds = favoriteIds.filter(favId => favId !== id);
            } else {
                favoriteIds.push(id);
            }
            document.getElementById('favCount').innerText = favoriteIds.length;
            
            // Jeśli jesteśmy w zakładce ulubionych, odśwież widok
            const activeBtn = document.querySelector('.action-buttons .btn-action.active');
            if (activeBtn && activeBtn.innerText.includes('Ulubione')) {
                showFavorites(activeBtn);
            } else {
                filterMovies();
            }
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
            renderMovies(filtered);
        }

        function showFavorites(btn) {
            setActiveButton(btn);
            const favMovies = allMovies.filter(m => favoriteIds.includes(m.id));
            renderMovies(favMovies);
        }

        function showAllMovies(btn) {
            setActiveButton(btn);
            renderMovies(allMovies);
        }

        function getRandomMovie() {
            if (allMovies.length === 0) return;
            const random = allMovies[Math.floor(Math.random() * allMovies.length)];
            openMovieDetails(random.id);
        }

        async function openMovieDetails(id) {
            const movie = allMovies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('modalTitle').innerText = movie.title;
            document.getElementById('modalDesc').innerText = movie.description;
            document.getElementById('modalTrailer').src = ""; // reset
            document.getElementById('movieModal').classList.add('active');

            try {
                const res = await fetch(`/api/trailer/${id}`);
                const data = await res.json();
                document.getElementById('modalTrailer').src = data.trailer;
            } catch (e) {
                document.getElementById('modalTrailer').src = "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ";
            }
        }

        function closeModal() {
            document.getElementById('modalTrailer').src = "";
            document.getElementById('movieModal').classList.remove('active');
        }

        function setActiveButton(btn) {
            document.querySelectorAll('.action-buttons .btn-action').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
