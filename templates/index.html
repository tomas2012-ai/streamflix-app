<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix Cinema Premium</title>
    <!-- Czcionki -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Ikony FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914;
            --primary-glow: rgba(229, 9, 20, 0.5);
            --bg-dark: #0b0c10;
            --card-bg: rgba(26, 28, 35, 0.6);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #8b8b9f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh;
            /* Nowoczesne, subtelne tło */
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(229, 9, 20, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(80, 20, 120, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 80px;
        }

        /* HEADER */
        header { 
            background: rgba(11, 12, 16, 0.7); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 20px 50px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .logo { 
            font-size: 30px; 
            font-weight: 800; 
            letter-spacing: 1px; 
            background: linear-gradient(135deg, #ff0f1a 0%, #ff5252 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .logo:hover { transform: scale(1.02); }

        .nav-actions { display: flex; gap: 15px; }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 10px 22px;
            border-radius: 30px; /* Zaokrąglone przyciski */
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .btn-primary:hover {
            background: #ff1e27;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }

        /* HERO SECTION */
        .hero { text-align: center; margin: 60px 0 50px; }
        .hero h1 { 
            font-size: 4rem; 
            font-weight: 800; 
            letter-spacing: -1px; 
            margin-bottom: 15px; 
            background: linear-gradient(to right, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1.3rem; max-width: 600px; margin: 0 auto; }

        /* PANEL KONTROLNY */
        .control-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px);
            padding: 20px 30px; 
            border-radius: 24px; 
            margin-bottom: 50px; 
            display: flex; 
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between; 
            gap: 20px; 
            border: 1px solid var(--card-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 500px;
        }
        .search-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }
        .search-box input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            padding: 16px 20px 16px 50px; /* Miejsce na ikonkę */
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus { 
            border-color: var(--primary); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        select { 
            background: rgba(0, 0, 0, 0.3); 
            color: #fff; 
            border: 1px solid var(--card-border); 
            padding: 16px 25px; 
            border-radius: 16px; 
            font-size: 15px;
            font-weight: 600;
            outline: none; 
            cursor: pointer;
            transition: all 0.3s;
            appearance: none; /* Ukrywa domyślną strzałkę, żeby wyglądało czyściej */
        }
        select:focus { border-color: var(--primary); }

        /* TYTUŁY SEKCJI */
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 50px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-title i { color: var(--primary); }

        /* GRID FILMÓW */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 30px; 
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; 
            border: 1px solid var(--card-border); 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        .card:hover { 
            transform: translateY(-12px); 
            border-color: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.8); 
        }

        .card-poster { 
            width: 100%; 
            height: 360px; 
            background-size: cover; 
            background-position: center; 
            position: relative;
        }

        /* Gradient i ikona Play na hover */
        .card-poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #0b0c10 0%, transparent 60%);
            transition: opacity 0.3s;
        }
        
        .play-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(229, 9, 20, 0.9);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            opacity: 0;
            z-index: 5;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .card:hover .play-indicator {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .fav-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
        }
        .fav-icon:hover { transform: scale(1.1); background: var(--primary); border-color: var(--primary); }
        .fav-icon.active { color: var(--primary); background: rgba(229, 9, 20, 0.1); border-color: var(--primary); }
        .fav-icon.active i { font-weight: 900; } /* Zapełnione serce we FontAwesome */

        .card-body { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
            position: relative;
            z-index: 2;
            margin-top: -30px;
        }

        .card-title { 
            font-size: 17px; 
            font-weight: 700; 
            color: #fff; 
            margin-bottom: 12px; 
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        
        .badge-rating { 
            background: rgba(245, 197, 24, 0.15); /* Złoty kolor jak z IMDb */
            color: #f5c518; 
            border: 1px solid rgba(245, 197, 24, 0.3); 
            padding: 6px 12px; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 700; 
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-year { font-size: 14px; color: var(--text-muted); font-weight: 600; }

        .load-more-box { text-align: center; margin: 60px 0; }

        /* REKOMENDACJE PRZEWIJANE POZIOMO */
        .horizontal-scroll {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding: 10px 0 30px 0;
            scroll-behavior: smooth;
        }
        /* Ukrywamy scrollbar dla lepszego efektu na desktopie/mobile (opcjonalne, ale wygląda lepiej) */
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .horizontal-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .horizontal-scroll .card { min-width: 240px; max-width: 240px; flex-shrink: 0; }

        /* MODAL / POP-UP */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(10px); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content { 
            background: #11131a; 
            width: 100%; 
            max-width: 900px; 
            border-radius: 24px; 
            padding: 40px; 
            position: relative; 
            border: 1px solid var(--card-border); 
            max-height: 90vh; 
            overflow-y: auto; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }

        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            font-size: 28px; 
            color: var(--text-muted); 
            cursor: pointer; 
            z-index: 10;
            background: rgba(255,255,255,0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .close-btn:hover { color: #fff; background: var(--primary); }

        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            border-radius: 16px; 
            margin-bottom: 30px; 
            background: #000; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .modal-title { font-size: 32px; font-weight: 800; margin-bottom: 15px; }
        .modal-desc { font-size: 16px; color: #b0b0c0; line-height: 1.8; margin-bottom: 25px; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .gallery-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .gallery-img:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="resetSearch()">STREAMFLIX</div>
        <div class="nav-actions">
            <button class="btn" onclick="showFavorites()">
                <i class="fa-solid fa-heart" style="color: var(--primary);"></i> Ulubione (<span id="favCount">0</span>)
            </button>
            <button class="btn btn-primary" onclick="randomMovie()">
                <i class="fa-solid fa-shuffle"></i> Losowy Film
            </button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Nieskończony Świat Kina</h1>
            <p>Odkrywaj tysiące filmów, oglądaj zwiastuny i przeglądaj galerie kadrów w bezkompromisowej jakości.</p>
        </div>

        <div class="control-panel">
            <div class="search-box search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Szukaj ulubionego filmu..." oninput="debounceLoad()">
            </div>
            
            <select id="genreSelect" onchange="resetAndLoad()">
                <option value="wszystkie">Wszystkie Gatunki</option>
                <option value="akcja">Akcja</option>
                <option value="sci-fi">Sci-Fi</option>
                <option value="dramat">Dramat</option>
                <option value="komedia">Komedia</option>
                <option value="horror">Horror</option>
                <option value="kryminal">Kryminał</option>
                <option value="thriller">Thriller</option>
                <option value="animacja">Animacja</option>
                <option value="fantasy">Fantasy</option>
                <option value="przygoda">Przygoda</option>
                <option value="dokument">Dokument</option>
                <option value="romans">Romans</option>
                <option value="wojenny">Wojenny</option>
            </select>
        </div>

        <!-- Główna Sekcja Filmów -->
        <h2 class="section-title" id="gridTitle"><i class="fa-solid fa-fire"></i> Odkrywaj Filmy</h2>
        <div class="grid" id="moviesGrid"></div>

        <div class="load-more-box" id="loadMoreBox">
            <button class="btn btn-primary" style="padding: 14px 40px; font-size: 16px; border-radius: 30px;" onclick="loadMore()">
                <i class="fa-solid fa-plus"></i> Załaduj Więcej
            </button>
        </div>

        <!-- Sekcja Rekomendacji Tematycznych -->
        <div id="rekomendacjeWrapper">
            <h2 class="section-title"><i class="fa-solid fa-flask"></i> Dla Fanów "Breaking Bad" i Mocnych Wrażeń</h2>
            <div class="horizontal-scroll" id="recBB"></div>

            <h2 class="section-title"><i class="fa-solid fa-rocket"></i> Klasyki Sci-Fi i Przegląd Kosmosu</h2>
            <div class="horizontal-scroll" id="recScifi"></div>

            <h2 class="section-title"><i class="fa-solid fa-burst"></i> Najlepsze Kino Akcji</h2>
            <div class="horizontal-scroll" id="recAction"></div>
        </div>
    </div>

    <!-- Modal ze szczegółami i zwiastunem -->
    <div id="filmModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></span>
            <div class="video-container" id="videoBox"></div>
            <h2 id="mTitle" class="modal-title"></h2>
            <p id="mDesc" class="modal-desc"></p>
            
            <h4 style="margin-bottom: 12px; font-size: 18px; color: #fff;"><i class="fa-solid fa-images"></i> Kadry z filmu</h4>
            <div class="gallery-grid" id="mGallery"></div>

            <div style="font-size: 15px; color: var(--text-muted); border-top: 1px solid var(--card-border); padding-top: 20px; margin-top: 20px;">
                <i class="fa-solid fa-users"></i> Obsada: <span id="mCastList" style="color: #fff; font-weight: 600;"></span>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let timer;
        let favorites = JSON.parse(localStorage.getItem('streamflix_favs')) || [];

        function updateFavCount() {
            document.getElementById('favCount').innerText = favorites.length;
        }

        function toggleFavorite(event, filmJson) {
            event.stopPropagation();
            const film = JSON.parse(decodeURIComponent(filmJson));
            const index = favorites.findIndex(f => f.id === film.id);
            
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(film);
            }
            
            localStorage.setItem('streamflix_favs', JSON.stringify(favorites));
            updateFavCount();
            
            // Odśwież wygląd serduszek
            document.querySelectorAll(`.fav-btn-${film.id}`).forEach(el => {
                el.classList.toggle('active');
                // Zmiana ikony na pełną (solid) lub pustą (regular) w FontAwesome
                el.innerHTML = index > -1 ? '<i class="fa-regular fa-heart"></i>' : '<i class="fa-solid fa-heart"></i>';
            });
        }

        function isFav(id) {
            return favorites.some(f => f.id === id);
        }

        function createCardHTML(film) {
            const favClass = isFav(film.id) ? 'active' : '';
            const favHeart = isFav(film.id) ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
            const filmStr = encodeURIComponent(JSON.stringify(film));

            return `
                <div class="card" onclick="openModal(${film.id})">
                    <div class="fav-icon fav-btn-${film.id} ${favClass}" onclick="toggleFavorite(event, '${filmStr}')">${favHeart}</div>
                    <div class="card-poster" style="background-image: url('${film.plakat}');">
                        <div class="play-indicator"><i class="fa-solid fa-play"></i></div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${film.tytul}</div>
                        <div class="card-meta">
                            <span class="badge-rating"><i class="fa-solid fa-star"></i> ${film.ocena}</span>
                            <span class="card-year">${film.rok}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function debounceLoad() {
            clearTimeout(timer);
            timer = setTimeout(resetAndLoad, 350);
        }

        function resetAndLoad() {
            currentPage = 1;
            document.getElementById('moviesGrid').innerHTML = '';
            document.getElementById('gridTitle').innerHTML = '<i class="fa-solid fa-fire"></i> Odkrywaj Filmy';
            document.getElementById('rekomendacjeWrapper').style.display = 'block';
            loadMovies();
        }

        // Tuta masz swoją funkcję loadMovies, która łączy się z Twoim backendem w Pythonie
        async function loadMovies() {
            const genre = document.getElementById('genreSelect').value;
            const search = document.getElementById('searchInput').value;
            
            try {
                const response = await fetch(`/api/filmy?gatunek=${genre}&szukaj=${encodeURIComponent(search)}&page=${currentPage}`);
                const data = await response.json();
                
                const grid = document.getElementById('moviesGrid');
                
                if (search.length > 0) {
                    document.getElementById('rekomendacjeWrapper').style.display = 'none';
                }

                if (!data.results || data.results.length === 0) {
                    if (currentPage === 1) grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 80px; font-size: 18px;"><i class="fa-solid fa-ghost" style="font-size: 40px; margin-bottom: 15px; display: block;"></i>Brak wyników. Spróbuj zmienić zapytanie.</p>';
                    document.getElementById('loadMoreBox').style.display = 'none';
                    return;
                }

                data.results.forEach(film => {
                    grid.innerHTML += createCardHTML(film);
                });

                document.getElementById('loadMoreBox').style.display = currentPage < data.total_pages ? 'block' : 'none';
            } catch (err) {
                console.error("Błąd pobierania filmów:", err);
            }
        }

        function loadMore() {
            currentPage++;
            loadMovies();
        }

        async function loadRekomendacje() {
            try {
                const res = await fetch('/api/rekomendacje');
                const data = await res.json();

                const renderSection = (id, list) => {
                    const box = document.getElementById(id);
                    if (list && list.length > 0) {
                        box.innerHTML = list.map(f => createCardHTML(f)).join('');
                    } else {
                        box.innerHTML = '<p style="color: var(--text-muted);">Trwa ładowanie rekomendacji...</p>';
                    }
                };

                renderSection('recBB', data.breaking_bad || []);
                renderSection('recScifi', data.scifi_classics || []);
                renderSection('recAction', data.action_hits || []);
            } catch (err) {
                console.error("Błąd pobierania rekomendacji:", err);
            }
        }

        async function randomMovie() {
            try {
                const res = await fetch('/api/losowy');
                const data = await res.json();
                if (data.id) openModal(data.id);
            } catch (err) {
                console.error("Błąd:", err);
            }
        }

        function showFavorites() {
            document.getElementById('rekomendacjeWrapper').style.display = 'none';
            document.getElementById('gridTitle').innerHTML = '<i class="fa-solid fa-heart" style="color: var(--primary);"></i> Twoje Ulubione Filmy';
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';
            document.getElementById('loadMoreBox').style.display = 'none';

            if (favorites.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 80px; font-size: 18px;"><i class="fa-regular fa-face-frown-open" style="font-size: 40px; margin-bottom: 15px; display: block;"></i>Nie dodałeś jeszcze żadnych filmów do ulubionych!</p>';
                return;
            }

            favorites.forEach(film => {
                grid.innerHTML += createCardHTML(film);
            });
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('genreSelect').value = 'wszystkie';
            resetAndLoad();
        }

        async function openModal(movieId) {
            try {
                const res = await fetch(`/api/film/${movieId}`);
                const film = await res.json();
                
                document.getElementById('mTitle').innerText = `${film.tytul} (${film.rok})`;
                document.getElementById('mDesc').innerText = film.opis;
                document.getElementById('mCastList').innerText = film.obsada;

                // Galeria
                const gBox = document.getElementById('mGallery');
                gBox.innerHTML = '';
                if (film.zdjecia && film.zdjecia.length > 0) {
                    film.zdjecia.forEach(url => {
                        gBox.innerHTML += `<img src="${url}" class="gallery-img">`;
                    });
                } else {
                    gBox.innerHTML = '<p style="color:var(--text-muted); font-size:14px; grid-column: 1/-1;">Brak dodatkowych kadrów dla tego filmu.</p>';
                }
                
                const videoBox = document.getElementById('videoBox');
                if(film.trailer_key) {
                    videoBox.style.display = 'block';
                    videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${film.trailer_key}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                } else {
                    videoBox.style.display = 'none';
                    videoBox.innerHTML = '';
                }
                
                document.getElementById('filmModal').style.display = 'flex';
            } catch (err) {
                console.error("Błąd pobierania detali filmu:", err);
            }
        }

        function closeModalDirect() {
            document.getElementById('filmModal').style.display = 'none';
            document.getElementById('videoBox').innerHTML = ''; // Zatrzymuje trailer po zamknięciu
        }

        function closeModal(event) {
            if (event.target.id === 'filmModal') closeModalDirect();
        }

        // Inicjalizacja przy załadowaniu strony
        updateFavCount();
        loadMovies();
        loadRekomendacje();
    </script>
</body>
</html>
