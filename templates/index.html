<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix — Baza i Wyszukiwarka Filmowa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #E50914;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        /* EKRAN STARTOWY */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(18,18,18,0.95)),
                        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1920') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 1000; padding: 20px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .welcome-title { font-size: 4rem; color: var(--primary); font-weight: 900; letter-spacing: 3px; margin-bottom: 10px; }
        .welcome-desc { font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin-bottom: 30px; }
        
        .btn-enter {
            padding: 16px 40px; font-size: 1.1rem; font-weight: bold; color: #fff;
            background: var(--primary); border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.6); transition: all 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-enter:hover { transform: scale(1.05); background: #ff0f1a; box-shadow: 0 0 35px rgba(229, 9, 20, 0.9); }

        /* NAWIGACJA */
        header {
            position: sticky; top: 0; z-index: 500; background: #181818;
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #282828;
        }
        .logo { color: var(--primary); font-size: 26px; font-weight: 900; text-decoration: none; }
        
        .search-bar { display: flex; align-items: center; background: #252525; border-radius: 20px; padding: 5px 15px; width: 300px; }
        .search-bar input { background: transparent; border: none; outline: none; color: #fff; width: 100%; padding: 5px; }
        .search-bar i { color: var(--text-muted); }

        /* OPCIe I GATUNKI */
        .controls-section { padding: 30px 40px 10px; display: flex; flex-direction: column; gap: 20px; }
        .action-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .btn-action {
            padding: 10px 20px; background: #282828; color: #fff; border: 1px solid #3a3a3a;
            border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease;
        }
        .btn-action:hover, .btn-action.active { background: var(--primary); border-color: var(--primary); }

        .genre-tags { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .genre-tag {
            padding: 6px 16px; background: #222; border-radius: 15px; font-size: 0.85rem;
            color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .genre-tag:hover, .genre-tag.active { background: #fff; color: #000; font-weight: bold; }

        /* SIATKA FILMÓW */
        .main-container { padding: 20px 40px 60px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        
        .movie-card {
            background: var(--card-bg); border-radius: 10px; overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; position: relative;
        }
        .movie-card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
        .movie-card img { width: 100%; height: 280px; object-fit: cover; }
        
        .fav-icon {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; transition: 0.2s;
        }
        .fav-icon.active { color: var(--primary); }

        .movie-info { padding: 12px; }
        .movie-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* POPUP SZEGÓŁÓW FILMU */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: 0.3s ease;
        }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: #1e1e1e; width: 90%; max-width: 700px; border-radius: 12px;
            overflow: hidden; position: relative; padding: 25px; display: flex; flex-direction: column; gap: 15px;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; }
        .modal-title { font-size: 1.8rem; color: var(--primary); }
        .modal-desc { font-size: 0.95rem; line-height: 1.5; color: #ddd; }
    </style>
</head>
<body>

    <!-- 1. EKRAN STARTOWY -->
    <div id="welcome-screen">
        <h1 class="welcome-title">STREAMFLIX</h1>
        <p class="welcome-desc">Wszystkie filmy świata w jednym miejscu. Przeglądaj, szukaj, odkrywaj i twórz własną listę ulubionych kinowych hitów.</p>
        <button class="btn-enter" onclick="enterApp()">
            <span>Odkrywaj Filmy</span>
            <i class="fa-solid fa-compass"></i>
        </button>
    </div>

    <!-- 2. NAWIGACJA -->
    <header>
        <a href="#" class="logo">STREAMFLIX</a>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Szukaj tytułu..." oninput="filterMovies()">
        </div>
    </header>

    <!-- 3. KONTROLI I GATUNKI -->
    <section class="controls-section">
        <div class="action-buttons">
            <button class="btn-action active" onclick="showAllMovies(this)">
                <i class="fa-solid fa-film"></i> Wszystkie Filmy
            </button>
            <button class="btn-action" onclick="getRandomMovie()">
                <i class="fa-solid fa-dice"></i> Wylosuj Film
            </button>
            <button class="btn-action" onclick="showFavorites(this)">
                <i class="fa-solid fa-heart"></i> Ulubione (<span id="favCount">0</span>)
            </button>
        </div>

        <div class="genre-tags" id="genreContainer">
            <span class="genre-tag active" onclick="filterGenre('Wszystkie', this)">Wszystkie</span>
            <span class="genre-tag" onclick="filterGenre('Akcja', this)">Akcja</span>
            <span class="genre-tag" onclick="filterGenre('Dramat', this)">Dramat</span>
            <span class="genre-tag" onclick="filterGenre('Komedia', this)">Komedia</span>
            <span class="genre-tag" onclick="filterGenre('Sci-Fi', this)">Sci-Fi</span>
            <span class="genre-tag" onclick="filterGenre('Thriller', this)">Thriller</span>
        </div>
    </section>

    <!-- 4. LISTA FILMÓW -->
    <main class="main-container">
        <div class="movie-grid" id="movieGrid"></div>
    </main>

    <!-- 5. OKNO SZCZEGÓŁÓW FILMU -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 class="modal-title" id="modalTitle">Tytuł Filmu</h2>
            <p style="color: #888; font-size: 0.85rem;" id="modalGenre">Gatunek: Akcja</p>
            <p class="modal-desc" id="modalDesc">Opis filmu...</p>
            <div style="padding: 30% 0 0 0; position:relative; border-radius: 8px; overflow: hidden;">
                <iframe id="modalTrailer" src="" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];
        let favoriteIds = [];
        let currentGenre = 'Wszystkie';

        function enterApp() {
            document.getElementById('welcome-screen').classList.add('hidden');
            fetchMovies();
        }

        async function fetchMovies() {
            try {
                const response = await fetch('/api/movies');
                allMovies = await response.json();
                renderMovies(allMovies);
            } catch (err) {
                console.error("Błąd pobierania filmów:", err);
            }
        }

        function renderMovies(movies) {
            const container = document.getElementById('movieGrid');
            container.innerHTML = '';

            if (movies.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">Brak filmów do wyświetlenia.</p>`;
                return;
            }

            movies.forEach(movie => {
                const isFav = favoriteIds.includes(movie.id);
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="fav-icon ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${movie.id})">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <img src="${movie.poster}" alt="${movie.title}" onclick="openMovieDetails(${movie.id})">
                    <div class="movie-info" onclick="openMovieDetails(${movie.id})">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.genre || 'Film'}</span>
                            <span>⭐ ${movie.rating || '8.0'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favoriteIds.includes(id)) {
                favoriteIds = favoriteIds.filter(favId => favId !== id);
            } else {
                favoriteIds.push(id);
            }
            document.getElementById('favCount').innerText = favoriteIds.length;
            filterMovies();
        }

        function filterGenre(genre, element) {
            currentGenre = genre;
            document.querySelectorAll('.genre-tag').forEach(tag => tag.classList.remove('active'));
            element.classList.add('active');
            filterMovies();
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => {
                const matchesSearch = m.title.toLowerCase().includes(query);
                const matchesGenre = currentGenre === 'Wszystkie' || (m.genre && m.genre.includes(currentGenre));
                return matchesSearch && matchesGenre;
            });
            renderMovies(filtered);
        }

        function showFavorites(btn) {
            setActiveButton(btn);
            const favMovies = allMovies.filter(m => favoriteIds.includes(m.id));
            renderMovies(favMovies);
        }

        function showAllMovies(btn) {
            setActiveButton(btn);
            filterMovies();
        }

        function getRandomMovie() {
            if (allMovies.length === 0) return;
            const random = allMovies[Math.floor(Math.random() * allMovies.length)];
            openMovieDetails(random.id);
        }

        function openMovieDetails(id) {
            const movie = allMovies.find(m => m.id === id);
            if (!movie) return;

            document.getElementById('modalTitle').innerText = movie.title;
            document.getElementById('modalGenre').innerText = 'Gatunek: ' + (movie.genre || 'Ogólny');
            document.getElementById('modalDesc').innerText = movie.description || 'Świetna produkcja kinowa. Zobacz oficjalny zwiastun poniżej.';
            document.getElementById('modalTrailer').src = movie.trailer || "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ";

            document.getElementById('movieModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalTrailer').src = "";
            document.getElementById('movieModal').classList.remove('active');
        }

        function setActiveButton(btn) {
            document.querySelectorAll('.action-buttons .btn-action').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
